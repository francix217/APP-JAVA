<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<div layout:fragment="content">

    <div class="container mt-5">

        <div class="compra-card">

            <h1 class="compra-titulo">
                🛒 Confirmar Compra
            </h1>

            <div class="compra-info">

                <h3 th:text="${producto.nombre}">
                    Nombre Producto
                </h3>

                <p>
                    💰 Precio:
                    <strong>
                        $<span th:text="${producto.precio}"></span>
                    </strong>
                </p>

                <p>
                    📦 Stock disponible:
                    <span class="stock-disponible"
                          th:text="${producto.stock}">
                    </span>
                </p>

            </div>

            <form th:action="@{/compra/confirmar}"
                  method="post">

                <input type="hidden"
                       name="idProducto"
                       th:value="${producto.id}">

                <div class="mb-3">

                    <label for="cantidad">
                        Cantidad a comprar:
                    </label>

                    <input type="number"
                           id="cantidad"
                           name="cantidad"
                           min="1"
                           th:max="${producto.stock}"
                           required
                           class="cantidad-input">

                </div>

                <button type="submit"
                        class="btn-confirmar">
                    Confirmar Compra
                </button>

            </form>

            <div class="mt-3">

                <a th:href="@{/verProductos}">
                    <button class="btn-volver">
                        Volver a Productos
                    </button>
                </a>

            </div>

        </div>

    </div>

</div>

</html>
